name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy3.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy1.outputs.page_url }}
    steps:
      # Re-provision the Pages site as an Actions source before deploying.
      # A prior delete/reset can leave the site half-provisioned (API
      # status: null), which makes deploy-pages fail with "Deployment
      # failed, try again later". enablement:true initialises it.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      # The deploy backend can also fail transiently; retry up to 3 times.
      - id: deploy1
        name: Deploy to Pages (attempt 1)
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deploy1.outcome == 'failure'
        name: Wait, then retry
        run: sleep 30
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        name: Deploy to Pages (attempt 2)
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        name: Wait, then final retry
        run: sleep 60
      - id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        name: Deploy to Pages (attempt 3)
        uses: actions/deploy-pages@v4
